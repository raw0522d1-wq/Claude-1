/* Layout: one phone-width column (max 520px). Sticky brand bar, fixed bottom tab bar.
   Morning prayer and first-run setup are full-screen overlays; editing happens in bottom sheets.
   The single bold element is the plant on Today, which grows as the day's three tasks are tended. */
:root{
  --bg:#EDF1E8; --surface:#F9FBF5; --surface-2:#E3EADD; --ink:#14231A; --ink-2:#506055; --line:#D3DCCC;
  --leaf:#2A6743; --leaf-2:#3E8A5B; --leaf-soft:#D2E5CF; --on-leaf:#F4F8F0;
  --bloom:#D98E24; --bloom-ink:#8F5A0E; --bloom-soft:#F5E2BE; --soil:#8E6D4F; --soil-2:#6B4F37;
  --dawn:#F4E3C4; --bar:rgb(249 251 245 / .9); --scrim:rgb(12 22 16 / .42);
  --shadow:0 1px 2px rgb(20 35 26 / .06), 0 10px 28px -14px rgb(20 35 26 / .22);
  --danger:#A63D2F;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-word:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --r-lg:24px; --r-md:18px; --r-sm:12px;

}

  --bg:#0C1510; --surface:#131F18; --surface-2:#1B2A22; --ink:#E5EEE2; --ink-2:#9AAB9F; --line:#26372D;
  --leaf:#7EC894; --leaf-2:#5FAE78; --leaf-soft:#1D3526; --on-leaf:#0C1510;
  --bloom:#F0AE48; --bloom-ink:#F3BD69; --bloom-soft:#3A2D16; --soil:#A5825F; --soil-2:#7D6046;
  --dawn:#1D2A1F; --bar:rgb(19 31 24 / .9); --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 30px -14px rgb(0 0 0 / .6);
  --danger:#E27A6B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1510; --surface:#131F18; --surface-2:#1B2A22; --ink:#E5EEE2; --ink-2:#9AAB9F; --line:#26372D;
  --leaf:#7EC894; --leaf-2:#5FAE78; --leaf-soft:#1D3526; --on-leaf:#0C1510;
  --bloom:#F0AE48; --bloom-ink:#F3BD69; --bloom-soft:#3A2D16; --soil:#A5825F; --soil-2:#7D6046;
  --dawn:#1D2A1F; --bar:rgb(19 31 24 / .9); --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 30px -14px rgb(0 0 0 / .6);
  --danger:#E27A6B; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; margin:0; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2.5px solid var(--bloom); outline-offset:2px; border-radius:10px}
h1,h2,h3{font-family:var(--f-display); font-weight:650; letter-spacing:-.015em; margin:0; text-wrap:balance}
p{margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- shell */
.app{max-width:520px; margin:0 auto; padding-inline:18px; padding-block:0 calc(104px + env(safe-area-inset-bottom, 0px))}
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; height:60px; margin-inline:-18px; padding-inline:18px; background:var(--bg)}
.topbar::after{content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px; background:linear-gradient(var(--bg), transparent); pointer-events:none}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:-.02em}
.brand-mark{width:30px; height:30px; flex:none}
.top-actions{display:flex; align-items:center; gap:6px}
.streak-chip{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px 0 9px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-variant-numeric:tabular-nums}
.streak-chip svg{width:20px; height:20px; color:var(--leaf)}
.streak-chip.hot svg{color:var(--bloom)}
.icon-btn{display:inline-grid; place-items:center; width:40px; height:40px; border-radius:999px; color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px; height:22px}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bar); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabbar-inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); padding:6px 8px 8px}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 4px; font-size:12px; font-weight:600; color:var(--ink-2); border-radius:14px; position:relative}
.tab svg{width:24px; height:24px; transition:transform .3s var(--ease-spring)}
.tab[aria-current="page"]{color:var(--leaf)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.tab[aria-current="page"]::before{content:""; position:absolute; top:-7px; width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--leaf)}

.view{display:flex; flex-direction:column; gap:18px; padding-top:6px; animation:viewIn .45s var(--ease-out)}
@keyframes viewIn{from{opacity:.001; transform:translateY(8px)}}
.eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:4px}
.section-head h2{font-size:20px}
.section-head .count{font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums}
.page-title{font-size:30px; line-height:1.1}
.muted{color:var(--ink-2)}

/* ---------- buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 22px; border-radius:999px; background:var(--leaf); color:var(--on-leaf); font-weight:700; letter-spacing:.005em; transition:transform .15s ease, filter .2s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.06)}
.btn svg{width:20px; height:20px}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.soft{background:var(--leaf-soft); color:var(--leaf)}
.btn.danger{background:transparent; color:var(--danger); border:1.5px solid currentColor}
.btn.block{width:100%}
.btn.sm{min-height:40px; padding:0 16px; font-size:14.5px}
.link-btn{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 2px; font-size:14.5px; font-weight:650; color:var(--leaf)}
.link-btn svg{width:17px; height:17px}
a.link-btn{text-decoration:none}

/* ---------- hero */
.hero{position:relative; display:grid; grid-template-columns:minmax(0,1fr) 118px; grid-template-areas:"copy copy" "info plant"; gap:6px 6px; padding:20px 20px 16px; border-radius:var(--r-lg); background:linear-gradient(160deg, var(--surface) 0%, var(--surface) 55%, var(--leaf-soft) 150%); border:1px solid var(--line); overflow:hidden}
.hero-copy{grid-area:copy; display:flex; flex-direction:column; gap:8px; min-width:0}
.hero .hero-theme{max-width:34ch}
.hero h1{font-size:clamp(26px, 7.4vw, 34px); line-height:1.06; font-weight:700; letter-spacing:-.03em}
.hero-theme{font-size:15px; color:var(--ink-2); line-height:1.45}
.theme-tag{display:inline-block; margin-right:6px; font-family:var(--f-word); font-style:italic; font-size:17px; color:var(--leaf); font-weight:500}
.plant-wrap{position:relative; width:118px; height:128px}
.hero .plant-wrap{grid-area:plant; align-self:end; justify-self:end; margin:-6px -6px -6px 0}
.hero-info{grid-area:info; display:flex; flex-direction:column; gap:10px; align-self:end; padding-bottom:8px; min-width:0}
.hero-count{font-family:var(--f-display); font-weight:700; font-size:40px; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.hero-count small{font-size:17px; font-weight:600; color:var(--ink-2); letter-spacing:0; margin-left:4px}
.meter{display:flex; gap:5px; flex:none}
.meter span{width:26px; height:8px; border-radius:99px; background:var(--line); transition:background .4s ease}
.meter span.on{background:var(--leaf)}
.hero-status{font-size:14px; color:var(--ink-2); min-width:0}
.hero-status b{color:var(--ink); font-variant-numeric:tabular-nums}
.hero.complete{background:linear-gradient(160deg, var(--surface) 0%, var(--surface) 45%, var(--bloom-soft) 140%)}

/* ---------- plant */
.plant{width:100%; height:100%; overflow:visible}
.plant .soil{fill:var(--soil); opacity:.9}
.plant .soil-top{fill:var(--soil-2); opacity:.5}
.plant .seed{fill:var(--soil-2); transform-box:fill-box; transform-origin:50% 50%; transition:transform .5s var(--ease-out), opacity .4s}
.plant .stem{fill:none; stroke:var(--leaf); stroke-width:4.2; stroke-linecap:round; stroke-dasharray:100 130; stroke-dashoffset:100; opacity:0; transition:stroke-dashoffset 1s var(--ease-out), opacity .2s}
.plant.s1 .stem{opacity:1}
.plant .lf{fill:var(--leaf); transform:scale(0); transform-origin:0 0; transition:transform .7s var(--ease-spring) .35s}
.plant .lf.alt{fill:var(--leaf-2)}
.plant .bloom{transform:scale(0) rotate(-40deg); transform-origin:0 0; transition:transform .9s var(--ease-spring) .55s}
.plant .petal{fill:var(--bloom)}
.plant .eye{fill:var(--soil-2)}
.plant .sway{transform-origin:70px 128px; animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)} 50%{transform:rotate(1.4deg)}}
.plant.s1 .seed{transform:scale(0); opacity:0}
.plant.s1 .stem{stroke-dashoffset:64}
.plant.s2 .stem{stroke-dashoffset:34}
.plant.s3 .stem{stroke-dashoffset:0}
.plant.s1 .g1, .plant.s2 .g2, .plant.s3 .g3{transform:scale(1)}
.plant.s3 .bloom{transform:scale(1) rotate(0)}
.petal-fx{position:absolute; left:50%; top:22%; width:10px; height:14px; border-radius:60% 60% 60% 60% / 70% 70% 40% 40%; background:var(--bloom); pointer-events:none; animation:petal 1.5s var(--ease-out) forwards}
@keyframes petal{0%{transform:translate(-50%,0) rotate(0) scale(.4); opacity:1} 100%{transform:translate(calc(-50% + var(--x)), var(--y)) rotate(var(--r)) scale(1); opacity:0}}

/* ---------- prayer card */
.prayer-card{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"eye cta" "ref cta" "quote quote"; gap:2px 12px; width:100%; text-align:left; padding:16px 18px; border-radius:var(--r-md); background:var(--dawn); border:1px solid var(--line); transition:transform .15s}
.prayer-card:active{transform:scale(.99)}
.pc-eye{grid-area:eye; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--bloom-ink)}
.pc-ref{grid-area:ref; font-family:var(--f-display); font-weight:650; font-size:18px}
.pc-th{display:block; font-family:var(--f-word); font-style:italic; font-weight:500; font-size:17px; color:var(--bloom-ink)}
.pc-quote{grid-area:quote; margin-top:6px; font-family:var(--f-word); font-size:16.5px; line-height:1.45; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.pc-cta{grid-area:cta; align-self:center; display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:99px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-size:14px; color:var(--ink)}
.pc-cta.done{color:var(--leaf)}
.pc-cta svg{width:16px; height:16px}

/* ---------- tasks */
.tasks{display:flex; flex-direction:column; gap:12px}
.task{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; padding:16px 16px 12px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line); transition:background .3s, border-color .3s}
.task.done{background:transparent; border-style:dashed}
.check{width:32px; height:32px; margin-top:1px; border-radius:50%; border:2px solid var(--ink-2); display:grid; place-items:center; color:var(--on-leaf); transition:background .25s, border-color .25s, transform .2s}
.check svg{width:18px; height:18px; stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .35s var(--ease-out) .05s}
.check[aria-pressed="true"]{background:var(--leaf); border-color:var(--leaf)}
.check[aria-pressed="true"] svg{stroke-dashoffset:0}
.check:disabled{cursor:default; opacity:.75}
.check:not(:disabled):active{transform:scale(.9)}
.check.pop{animation:pop .5s var(--ease-spring)}
@keyframes pop{0%{transform:scale(.7)} 60%{transform:scale(1.15)} 100%{transform:scale(1)}}
.task-main{min-width:0; display:flex; flex-direction:column; gap:6px}
.task-title{font-family:var(--f-body); font-size:17px; font-weight:650; letter-spacing:-.005em; line-height:1.35}
.task.done .task-title{color:var(--ink-2)}
.task-ref{font-size:13px; color:var(--ink-2); font-weight:500}
.task-ref .tended{color:var(--leaf); font-weight:700}
.try{display:flex; flex-direction:column; gap:2px; margin-top:4px; padding:10px 12px; border-radius:var(--r-sm); background:var(--bg)}
.try-label{font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--bloom-ink)}
.try p{font-size:14.5px; line-height:1.45}
.task.done .try, .task.done .ideas, .task.done [data-act="toggle-ideas"]{display:none}
.task.done .task-actions{justify-content:flex-end}
.task-actions{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:2px}
.ideas{list-style:none; margin:2px 0 4px; padding:0; display:flex; flex-direction:column; gap:8px}
.ideas li{position:relative; padding-left:22px; font-size:14.5px; line-height:1.45; color:var(--ink)}
.ideas li::before{content:""; position:absolute; left:3px; top:.45em; width:10px; height:10px; border-radius:0 70% 0 70%; background:var(--leaf-2); opacity:.8}

.hint{display:flex; gap:12px; align-items:center; padding:14px 16px; border-radius:var(--r-md); border:1.5px dashed var(--line); font-size:14.5px; color:var(--ink-2)}
.hint svg{width:22px; height:22px; flex:none; color:var(--bloom-ink)}
.hint button{margin-left:auto; flex:none}

/* ---------- week */
.daypicker{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px}
.dp{display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 0 9px; border-radius:16px; border:1px solid transparent; font-variant-numeric:tabular-nums}
.dp .dl{font-size:12px; font-weight:700; color:var(--ink-2); letter-spacing:.04em}
.dp .dn{font-family:var(--f-display); font-weight:650; font-size:18px; line-height:1}
.dp .dots{display:flex; gap:3px}
.dp .dots i{width:5px; height:5px; border-radius:50%; background:var(--line)}
.dp .dots i.on{background:var(--leaf)}
.dp.today .dn{color:var(--leaf)}
.dp[aria-selected="true"]{background:var(--surface); border-color:var(--line); box-shadow:var(--shadow)}
.day-head{display:flex; flex-direction:column; gap:6px; padding:4px 2px 0}
.day-head h2{font-size:26px}
.day-head .theme-tag{font-size:20px}
.status-pill{align-self:flex-start; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px; border-radius:99px; font-size:13px; font-weight:700; background:var(--surface-2); color:var(--ink-2)}
.status-pill.good{background:var(--leaf-soft); color:var(--leaf)}
.status-pill.warn{background:var(--bloom-soft); color:var(--bloom-ink)}

/* ---------- garden */
.streak-card{display:grid; grid-template-columns:minmax(0,1fr) 116px; align-items:end; gap:8px; padding:22px 20px 16px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); overflow:hidden}
.streak-big{font-family:var(--f-display); font-weight:750; font-size:76px; line-height:.9; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.streak-label{font-weight:700; font-size:16px; margin-top:6px}
.streak-sub{font-size:14px; color:var(--ink-2); margin-top:4px}
.streak-card .plant-wrap{width:116px; height:128px}
.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.stat{padding:14px 12px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line)}
.stat b{display:block; font-family:var(--f-display); font-size:26px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px; color:var(--ink-2); font-weight:600; line-height:1.3; display:block; margin-top:3px}
.milestone{display:flex; flex-direction:column; gap:10px; padding:16px 18px; border-radius:var(--r-md); background:var(--leaf-soft)}
.milestone-top{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.milestone-top b{font-family:var(--f-display); font-size:18px; color:var(--leaf)}
.milestone-top span{font-size:13.5px; color:var(--ink-2); font-weight:600; text-align:right}
.bar{height:8px; border-radius:99px; background:var(--surface); overflow:hidden}
.bar i{display:block; height:100%; border-radius:99px; background:var(--leaf); transition:width .8s var(--ease-out)}
.milestone small{font-family:var(--f-word); font-style:italic; font-size:15px; color:var(--ink-2)}
.garden-card{padding:16px 14px 14px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
.garden-card h2{font-size:18px}
.plot{display:grid; grid-template-columns:16px repeat(12, minmax(0,1fr)); gap:5px; font-variant-numeric:tabular-nums}
.plot .ml{font-size:10.5px; font-weight:700; color:var(--ink-2); white-space:nowrap; overflow:visible; height:14px; letter-spacing:.02em}
.plot .rl{font-size:10.5px; font-weight:700; color:var(--ink-2); display:grid; place-items:center}
.cell{aspect-ratio:1; max-width:100%; border-radius:30% 30% 30% 30%; background:var(--surface-2); position:relative; display:grid; place-items:center}
.cell.l1{background:var(--leaf-soft)}
.cell.l2{background:color-mix(in oklab, var(--leaf-soft), var(--leaf) 45%)}
.cell.l3{background:var(--leaf)}
.cell.l3::after{content:""; width:34%; height:34%; border-radius:50%; background:var(--bloom)}
.cell.future{background:transparent; border:1px dashed var(--line)}
.cell.before{background:transparent}
.cell.today{outline:2px solid var(--bloom); outline-offset:1px}
.legend{display:flex; gap:14px; align-items:center; justify-content:flex-end; font-size:12.5px; color:var(--ink-2); font-weight:600}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend .cell{width:14px; height:14px}

/* ---------- journal */
.j-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.search{display:flex; align-items:center; gap:10px; height:46px; padding:0 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.search svg{width:19px; height:19px; color:var(--ink-2); flex:none}
.search input{flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:16px}
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-inline:-18px; padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:34px; padding:0 14px; border-radius:99px; border:1.5px solid var(--line); font-size:14px; font-weight:650; color:var(--ink-2); background:transparent}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.note-group{display:flex; flex-direction:column; gap:10px}
.note-date{font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); padding-left:2px}
.note{display:flex; flex-direction:column; gap:8px; width:100%; text-align:left; padding:14px 16px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line)}
.note-meta{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2); font-weight:600}
.tag{display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:99px; font-size:11.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; background:var(--leaf-soft); color:var(--leaf)}
.tag.prayer{background:var(--bloom-soft); color:var(--bloom-ink)}
.tag.kids{background:var(--surface-2); color:var(--ink)}
.note-text{font-size:15.5px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden}
.note-task{font-size:13px; color:var(--ink-2); font-style:italic}
.empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding:34px 20px; border-radius:var(--r-lg); border:1.5px dashed var(--line)}
.empty .plant-wrap{width:90px; height:100px}
.empty h3{font-size:19px}
.empty p{color:var(--ink-2); font-size:15px; max-width:34ch}

/* ---------- overlays + sheets */
.overlay{position:fixed; inset:0; z-index:60; overflow-y:auto; background:var(--bg); padding:env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); animation:overlayIn .5s var(--ease-out)}
@keyframes overlayIn{from{opacity:0; transform:translateY(16px)}}
.overlay-inner{max-width:520px; margin:0 auto; min-height:100%; padding:18px 22px 36px; display:flex; flex-direction:column}
.prayer{background:linear-gradient(180deg, var(--dawn) 0%, var(--bg) 60%)}
.prayer .close{align-self:flex-end}
.prayer .eyebrow{margin-top:6px}
.verse-ref{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:22px; font-family:var(--f-display); font-weight:700; font-size:22px; color:var(--leaf)}
.verse-ref .tag{font-family:var(--f-body)}
.verse{margin:14px 0 0; font-family:var(--f-word); font-size:clamp(25px, 7vw, 32px); line-height:1.3; font-weight:420; letter-spacing:-.01em; text-wrap:pretty}
.verse .q{color:var(--bloom)}
.translation{margin-top:10px; font-size:12.5px; color:var(--ink-2); font-weight:600; letter-spacing:.02em}
.leaf-rule{display:flex; align-items:center; gap:12px; margin:28px 0 22px; color:var(--leaf)}
.leaf-rule::before,.leaf-rule::after{content:""; flex:1; height:1px; background:var(--line)}
.leaf-rule svg{width:26px; height:26px}
.pray-title{font-size:21px}
.prayer-text{margin-top:12px; font-size:18px; line-height:1.6}
.prayer-text + .prayer-text{margin-top:10px}
.prayer-text.kids{color:var(--ink)}
.prayer-actions{display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:auto; padding-top:30px}
.prayer .reveal{opacity:0; animation:rise .8s var(--ease-out) forwards}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.btn.amen{min-width:220px; min-height:54px; font-size:17px}

.onboard .overlay-inner{justify-content:flex-start; gap:18px}
.ob-hero{display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding-top:14px}
.ob-hero .plant-wrap{width:150px; height:164px; align-self:center; margin:6px 0 4px}
.ob-word{font-family:var(--f-display); font-weight:750; font-size:46px; line-height:.95; letter-spacing:-.045em}
.ob-verse{font-family:var(--f-word); font-size:21px; line-height:1.4}
.ob-verse cite{display:block; margin-top:6px; font-family:var(--f-body); font-style:normal; font-size:13px; font-weight:700; color:var(--ink-2); letter-spacing:.04em}
.ob-lede{font-size:17px; color:var(--ink-2)}
.ob-steps{display:flex; gap:6px}
.ob-steps i{width:28px; height:5px; border-radius:99px; background:var(--line)}
.ob-steps i.on{background:var(--leaf)}
.ob-actions{display:flex; flex-direction:column; gap:10px; margin-top:auto; padding-top:20px}
.field{display:flex; flex-direction:column; gap:7px}
.field label,.field .lab{font-size:14px; font-weight:700}
.field small{font-size:13px; color:var(--ink-2)}
.input,.select{width:100%; min-height:50px; padding:0 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); font-size:16px; outline:none; transition:border-color .2s}
.select{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position:calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size:5px 5px; background-repeat:no-repeat; padding-right:36px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--leaf)}
.textarea{width:100%; min-height:150px; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); font-size:16px; line-height:1.5; resize:vertical; outline:none}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

.scrim{position:fixed; inset:0; z-index:70; background:var(--scrim); animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:80; max-height:92dvh; overflow-y:auto; background:var(--surface); border-radius:26px 26px 0 0; box-shadow:0 -10px 40px -10px rgb(0 0 0 / .25); padding-bottom:env(safe-area-inset-bottom, 0px); animation:sheetIn .38s var(--ease-out)}
@keyframes sheetIn{from{transform:translateY(100%)}}
.sheet-inner{max-width:520px; margin:0 auto; padding:10px 20px 26px; display:flex; flex-direction:column; gap:18px}
.grabber{width:40px; height:5px; border-radius:99px; background:var(--line); align-self:center}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.sheet-head h2{font-size:22px}
.set-group{display:flex; flex-direction:column; gap:14px; padding-top:18px; border-top:1px solid var(--line)}
.set-group h3{font-size:13px; font-family:var(--f-body); font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2)}
.switch-row{display:flex; align-items:center; justify-content:space-between; gap:14px}
.switch-row b{display:block; font-size:16px}
.switch-row small{display:block; font-size:13.5px; color:var(--ink-2); margin-top:2px}
.switch{flex:none; position:relative; width:52px; height:32px; border-radius:99px; background:var(--line); transition:background .25s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgb(0 0 0 / .25); transition:transform .3s var(--ease-spring)}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.notif-status{display:flex; gap:10px; padding:12px 14px; border-radius:14px; background:var(--bg); font-size:14px; line-height:1.45}
.notif-status svg{width:20px; height:20px; flex:none; margin-top:1px; color:var(--leaf)}
.notif-status.warn svg{color:var(--bloom-ink)}
.slots{display:flex; flex-wrap:wrap; gap:6px}
.slots span{height:28px; display:inline-flex; align-items:center; padding:0 10px; border-radius:99px; background:var(--bg); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.slots span.past{opacity:.45; text-decoration:line-through}
.btn-row{display:flex; flex-wrap:wrap; gap:10px}
.steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:14.5px}
.colophon{font-size:12.5px; color:var(--ink-2); line-height:1.5; padding-top:14px; border-top:1px solid var(--line)}
.confirm{display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:14px; background:var(--bg)}
.tagpick{display:flex; flex-wrap:wrap; gap:8px}
.note-actions{display:flex; justify-content:space-between; gap:10px}
.linked{font-size:14px; padding:10px 12px; border-radius:12px; background:var(--bg); color:var(--ink-2)}
.linked b{color:var(--ink); font-weight:650}

/* ---------- banner + toast */
.banner{position:fixed; z-index:90; top:calc(10px + env(safe-area-inset-top, 0px)); left:50%; width:min(94vw, 460px); transform:translateX(-50%); display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:20px; background:var(--bar); backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3); border:1px solid var(--line); box-shadow:var(--shadow); text-align:left; animation:dropIn .5s var(--ease-spring)}
@keyframes dropIn{from{transform:translate(-50%, -130%)}}
.banner.out{animation:dropOut .35s ease forwards}
@keyframes dropOut{to{transform:translate(-50%, -140%); opacity:0}}
.banner-icon{width:38px; height:38px; flex:none; border-radius:10px; overflow:hidden}
.banner-body{min-width:0; display:flex; flex-direction:column; gap:1px}
.banner-app{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
.banner-title{font-weight:700; font-size:15px}
.banner-text{font-size:14px; color:var(--ink-2); line-height:1.4}
.toast{position:fixed; z-index:95; left:50%; bottom:calc(96px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 20px); max-width:min(92vw, 440px); padding:12px 18px; border-radius:16px; background:var(--ink); color:var(--bg); font-weight:650; font-size:15px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .35s var(--ease-spring); text-align:center}
.toast.show{opacity:1; transform:translate(-50%, 0)}

@media (min-width:700px){ .app{padding-top:14px} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; transition-delay:0s !important}
  .plant .sway{animation:none}
}
</style>

<script>
(() => {
"use strict";
const DATA = {"week":[{"name":"Sunday","theme":"Gather","line":"Worship together and set the week before God.","tasks":[{"t":"Attend church together as a family.","ref":"Hebrews 10:24–25","ideas":["Lay out clothes and prep breakfast the night before so the morning is calm.","Leave ten minutes earlier than you need to and sit together unhurried.","On the drive, ask everyone to listen for one thing to share at lunch.","Watching online? Gather on one couch, phones down, and sing along."]},{"t":"Ask each family member what they learned.","ref":"Deuteronomy 6:6–7","ideas":["Ask over lunch: “What’s one thing you want to remember from today?”","Share your own takeaway first. It shows them what you mean.","For little ones: “What was the story about?” or “Draw it for me.”","Write their answers in your Journal and revisit them next Sunday."],"alt":{"t":"Ask your wife what stood out to her in worship.","ref":"Deuteronomy 6:6–7","ideas":["Ask over lunch: “What’s one thing you want to remember from today?”","Share your own takeaway first, then really listen to hers.","Ask how the message connects to something she is facing this week.","Write her answer in your Journal and pray about it tonight."]}},{"t":"Lead prayer or discussion over the week ahead.","ref":"Philippians 4:6","ideas":["Open the calendar together and pray over each big event by name.","Ask: “What are you nervous or excited about this week?” Then pray about those.","Keep it short: five minutes, one verse, one prayer.","Close with a blessing: “The LORD bless you and keep you.”"]}]},{"name":"Monday","theme":"Set the tone","line":"Start the week covered in prayer and kindness.","tasks":[{"t":"Start the week with prayer over your family.","ref":"Psalm 5:3","ideas":["Before you open your phone, pray over each person by name.","Pray on your commute using this morning’s Proverb.","Rest a hand on your wife’s shoulder while she sleeps and pray quietly.","Pray for their actual day: meetings, tests, errands, appointments."]},{"t":"Text your wife a word of encouragement.","ref":"1 Thessalonians 5:11","ideas":["Name something specific: “The way you handled ___ yesterday was pure strength.”","Send a verse with one line on why it made you think of her.","Keep it simple: “Thinking about you. Proud to be your husband.”","Time it for the busiest stretch of her day."]},{"t":"Do an evening devotion with family (10–15 mins).","ref":"Joshua 24:15","ideas":["Read one short passage, ask one question, and pray. That’s enough.","Let a child choose the verse or lead the closing prayer.","Keep a devotion basket ready: Bible, kids’ Bible, a candle, a notebook.","Do it right after dinner, before screens. Same time each week builds the habit."],"alt":{"t":"Do an evening devotion with your wife (10–15 mins).","ref":"Ecclesiastes 4:12","ideas":["Read one Psalm together and each share the line that stood out.","Take turns choosing the passage each week.","Light a candle, put phones in another room, and keep it unhurried.","End by praying for each other’s week, out loud."]}}]},{"name":"Tuesday","theme":"Model Christ","line":"Let your family see Jesus in how you live today.","tasks":[{"t":"Reflect on how you are modeling Jesus today.","ref":"1 Corinthians 11:1","ideas":["Pause at lunch: “Where was I patient today? Where did I react?”","Choose one fruit of the Spirit (Galatians 5:22–23) to practice on purpose.","Notice your tone when you walk in the door tonight. Lead with warmth.","Write one win and one growth area in your Journal."]},{"t":"Ask your child a question about their faith.","ref":"Psalm 78:4","ideas":["“What do you think God is like?”","“When do you feel close to God?”","“Is there anything about God that confuses you?”","Ask at bedtime, when kids talk most, and just listen."],"alt":{"t":"Ask your wife a question about her faith.","ref":"Proverbs 20:5","ideas":["“What has God been teaching you lately?”","“When have you felt closest to God this year?”","“Is there a prayer you’ve been waiting on?”","Ask on a walk or a drive, then listen without fixing."]}},{"t":"Affirm your wife with a specific compliment.","ref":"Proverbs 31:28","ideas":["Praise her character, not just her looks: “Your patience with ___ amazes me.”","Affirm her in front of the kids or friends.","Leave it on a sticky note on the mirror or her coffee mug.","Be specific: what she did, and what it meant to you."]}]},{"name":"Wednesday","theme":"Tend the soil","line":"Check the ground midweek and water what’s dry.","tasks":[{"t":"Midweek spiritual check-in with your wife.","ref":"1 Peter 3:7","ideas":["Ask: “How is your heart this week? How can I pray for you?”","Take a 15-minute walk after dinner, just the two of you.","Share where you’re struggling first. It makes room for her to share.","Close by praying together, holding hands."]},{"t":"Take note of any spiritual dryness in the home.","ref":"Proverbs 27:23","ideas":["Ask yourself: Have we prayed together this week? Opened Scripture?","Notice tension, busyness, or screens crowding out connection.","Write what you see in your Journal, then pick one small fix.","Put on worship music during dinner prep or the drive home."]},{"t":"Encourage each child with a spoken blessing.","ref":"Numbers 6:24–26","ideas":["Hand on their head: “The LORD bless you and keep you.”","Speak identity: “You are loved. You are brave. God made you on purpose.”","Name one quality you see God growing in them.","Make it the last thing they hear at bedtime."],"alt":{"t":"Speak a blessing over your wife.","ref":"Numbers 6:24–26","ideas":["Hold her hands and pray Numbers 6:24–26 over her by name.","Tell her one way you see God working in her life.","Bless her calling, her friendships, and her rest.","Make it the last thing you say before you both fall asleep."]}}]},{"name":"Thursday","theme":"Serve","line":"Lead the way Jesus led: on your knees and with your hands.","tasks":[{"t":"Pray over your wife and children by name.","ref":"Job 1:5","ideas":["Pray this morning’s Proverb over each of them by name.","Pray for their hearts, health, friendships, and futures.","Set a reminder for their busiest hour and pray then.","Tell them tonight: “I prayed for you today, specifically for ___.”"],"alt":{"t":"Pray over your wife by name.","ref":"Philippians 1:3–4","ideas":["Pray this morning’s Proverb over her by name.","Pray for her heart, health, friendships, and calling.","Pray during the hour she told you would be hardest.","Tell her tonight: “I prayed for you today, specifically for ___.”"]}},{"t":"Ask your wife, “How can I serve you today?”","ref":"Mark 10:45","ideas":["Ask early, before her day fills up.","Follow through fast. The doing matters more than the asking.","If she says “nothing,” choose something anyway: dishes, bath time, an errand.","Ask again tomorrow. Make it a habit, not a one-off."]},{"t":"Initiate a gratitude conversation with children.","ref":"1 Thessalonians 5:18","ideas":["At dinner, go around: “One thing you’re thankful for today.”","Try high, low, and hope: best part, hard part, something to look forward to.","Start a gratitude jar and add a slip each night.","Thank God together for everyone’s answers."],"alt":{"t":"Initiate a gratitude conversation with your wife.","ref":"1 Thessalonians 5:18","ideas":["Trade three things you’re each thankful for this week.","Name one thing about her you’re grateful for, and why.","Remember an answered prayer from this year together.","Thank God out loud for what you both named."]}}]},{"name":"Friday","theme":"Pursue","line":"Pursue your wife and celebrate God’s faithfulness.","tasks":[{"t":"Plan a date night or focused time with your wife.","ref":"Ecclesiastes 9:9","ideas":["Handle every detail: sitter, reservation, plan. She just shows up.","At-home date: kids in bed, phones in a drawer, her favorite takeout.","Bring one good question: “What’s a dream you haven’t told me lately?”","Keep it simple: a walk, coffee, or a drive with her playlist."]},{"t":"Ask your child, “How did you see God this week?”","ref":"Psalm 145:4","ideas":["Share your own answer first so they know what you mean.","Help them spot it: a kind friend, an answered prayer, something beautiful outside.","Ask over pizza night or in the car. Side-by-side talks feel easier.","Write their answers down. Over time it becomes a record of God’s faithfulness."],"alt":{"t":"Ask your wife, “How did you see God this week?”","ref":"Psalm 34:3","ideas":["Share your own answer first.","Look back through the week together: conversations, provision, answered prayer.","Ask over dinner or on a drive, without distractions.","Write her answer in your Journal."]}},{"t":"Thank God for specific family blessings together.","ref":"Psalm 103:2","ideas":["Name three specific blessings from this week out loud together.","Let everyone add one line to a family prayer of thanks.","Thank God for each person at the table by name.","Recall an answered prayer from earlier in the year."]}]},{"name":"Saturday","theme":"Sacrifice","line":"Give yourself away and look back on the week.","tasks":[{"t":"Do something sacrificial for your wife.","ref":"Ephesians 5:25","ideas":["Take the early shift so she can sleep in.","Knock out the chore she dreads most, without being asked.","Give her two or three free hours to do anything she enjoys.","Set aside something you had planned to do something she’d love."]},{"t":"Take a child out for 1-on-1 Dad time.","ref":"Psalm 127:3","ideas":["Breakfast, a hardware store run, the park, or a bike ride. Pick their favorite.","Let them choose the activity and the snack.","Ask one heart question: “What’s been hard lately?”","Rotate kids each week and track whose turn it is in your Journal."],"alt":{"t":"Meet up with a brother in the faith.","ref":"Proverbs 27:17","ideas":["Grab coffee or breakfast with a man who strengthens your walk.","Ask each other: “How are you really doing as a husband?”","Share one prayer request each and pray before you leave.","Can’t meet? Call him on a walk."]}},{"t":"Reflect on spiritual growth over the week.","ref":"2 Peter 3:18","ideas":["Scroll back through this week’s Journal notes.","Ask: “Where did I lead well? Where do I need grace?”","Thank God for one way your family grew this week.","Choose one focus for next week and write it down."]}]}],"prayers":[{"r":"1:7","th":"Reverence","p":"Lord, let the fear of You come first in our home, before my plans, my opinions, or my pride. Make me a teachable husband, and let {wife} see a man who bows before You before he leads.","k":"Plant a holy reverence in {kids} that grows deeper roots than anything this world offers.","v":"The fear of the LORD is the beginning of knowledge; but the foolish despise wisdom and instruction."},{"r":"1:8-9","th":"One voice","p":"Father, make my words worth listening to. Let what I teach at our table and in the car be true, gentle, and rooted in Your Word, and let {wife} and me speak with one voice.","k":"Let what we teach rest on {kids} like a garland of grace they wear for life.","v":"My son, listen to your father’s instruction, and don’t forsake your mother’s teaching: for they will be a garland to grace your head, and chains around your neck."},{"r":"2:6","th":"Wisdom","p":"Lord, You give wisdom, and I need it today. For every decision at work and at home, give me Your understanding over my own. Give {wife} wisdom for what is in front of her, and peace where she feels stretched.","k":"Open the hearts of {kids} to receive wisdom early and to know it comes from You.","v":"For the LORD gives wisdom. Out of his mouth comes knowledge and understanding."},{"r":"2:7-8","th":"Integrity","p":"Father, be a shield around my family. Keep me walking in integrity when no one is watching, so {wife} can rest in the man I am. Guard her path today, in every conversation and every drive.","k":"Preserve the way of {kids}. Set Your guard over their friendships and their steps.","v":"He lays up sound wisdom for the upright. He is a shield to those who walk in integrity, that he may guard the paths of justice, and preserve the way of his saints."},{"r":"3:5-6","th":"Trust","p":"Lord, I trust You with all my heart, including the parts I usually try to manage myself. Straighten the paths of our family this week. Where {wife} is carrying worry, lift it, and let her see me leaning on You first.","k":"Teach {kids} to acknowledge You in all their ways, big and small.","v":"Trust in the LORD with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight."},{"r":"3:3","th":"Kindness & truth","p":"Father, bind kindness and truth around my neck today. Let me be truthful without being harsh, and kind without being passive. Write Your ways on my heart so {wife} meets them in how I speak to her.","k":"Write kindness and truth on the hearts of {kids}, and let them see both in me.","v":"Don’t let kindness and truth forsake you. Bind them around your neck. Write them on the tablet of your heart."},{"r":"4:23","th":"Guard the heart","p":"Lord, help me guard my heart with diligence: what I watch, what I dwell on, where my mind wanders. Keep my affection for {wife} protected, undivided, and growing.","k":"Guard the hearts of {kids}. Let the wellspring of their lives run clean.","v":"Keep your heart with all diligence, for out of it is the wellspring of life."},{"r":"4:18","th":"Growing light","p":"Father, make our home's path like the dawn, brighter every year. Where we are in a dim season, bring light more and more. Let {wife} sense that our marriage is growing toward the full day.","k":"Let the faith of {kids} shine a little brighter each year.","v":"But the path of the righteous is like the dawning light that shines more and more until the perfect day."},{"r":"5:18","th":"Delight","p":"Lord, bless the spring of our marriage. Help me rejoice in {wife}, the wife of my youth, and delight in her with fresh eyes today. Keep my heart and my eyes fully hers.","k":"Let {kids} grow up watching a father who delights in their mother.","v":"Let your spring be blessed. Rejoice in the wife of your youth."},{"r":"5:21","th":"Seen by God","p":"Father, all my ways are before Your eyes. Make me the same man in private that I am in public. Let {wife} never have reason to wonder, and let my integrity be a safe place for her.","k":"Help {kids} learn that You see them and love them, in secret and in the open.","v":"For the ways of man are before the LORD’s eyes. He examines all his paths."},{"r":"6:20","th":"Heritage","p":"Lord, thank You for the faith handed down to me. Help me hold fast to what was good in how I was raised, and forgive what was not. Let {wife} and me build a heritage of faith together.","k":"Let {kids} keep Your commands close and never forsake what they learn in this home.","v":"My son, keep your father’s commandment, and don’t forsake your mother’s teaching."},{"r":"6:22","th":"Guidance","p":"Father, let Your Word lead me when I walk, watch over me when I sleep, and speak to me when I wake. Surround {wife} with that same guidance today, and give her deep rest tonight.","k":"Watch over {kids} as they sleep, and let them wake to Your voice.","v":"When you walk, it will lead you. When you sleep, it will watch over you. When you awake, it will talk with you."},{"r":"7:1","th":"Treasure the Word","p":"Lord, I want Your words stored up inside me, not sitting on a shelf. Give me a hunger for Scripture that {wife} can see, and let us open it together more often.","k":"Lay up Your Word in the hearts of {kids} while they are young.","v":"My son, keep my words. Lay up my commandments within you."},{"r":"7:2-3","th":"Written on the heart","p":"Father, let Your teaching be the apple of my eye. Bind it on my hands so my work honors You, and write it on my heart so my home does too. Give {wife} joy in Your Word today.","k":"Write Your ways on the hearts of {kids}, deeper than any lesson I could teach.","v":"Keep my commandments and live! Guard my teaching as the apple of your eye. Bind them on your fingers. Write them on the tablet of your heart."},{"r":"8:17","th":"Seek Him","p":"Lord, I want to seek You diligently, not with leftovers. Meet me in the early hours and the busy ones. Draw {wife} close to You today, and let her find You in unexpected places.","k":"Let {kids} seek You early and find that You were already there.","v":"I love those who love me. Those who seek me diligently will find me."},{"r":"8:34-35","th":"Daily at His door","p":"Father, make me a man who waits at Your door every day. Let that daily seeking bring life to our home and favor over our family. Give {wife} fresh life and strength for today.","k":"Grant {kids} favor with You and with people as they grow.","v":"Blessed is the man who hears me, watching daily at my gates, waiting at my door posts. For whoever finds me, finds life, and will obtain favor from the LORD."},{"r":"9:10","th":"Knowing Him","p":"Lord, the fear of You is the beginning of wisdom. Before I try to fix, lead, or advise, let me know You. Deepen {wife}'s knowledge of You today and let it give her understanding and peace.","k":"Let {kids} know You personally, not just know about You.","v":"The fear of the LORD is the beginning of wisdom. The knowledge of the Holy One is understanding."},{"r":"9:9","th":"Teachable","p":"Father, make me teachable, a man who grows wiser when corrected. When {wife} speaks honestly to me, give me ears to hear and the humility to change.","k":"Let {kids} see a father who learns, admits mistakes, and keeps growing.","v":"Instruct a wise person, and he will be still wiser. Teach a righteous person, and he will increase in learning."},{"r":"10:12","th":"Love covers","p":"Lord, let love cover the small offenses in our home before they become walls. Where there is lingering tension with {wife}, give me the grace to go first in making peace.","k":"Let {kids} grow up in a home where love covers and forgiveness comes quickly.","v":"Hatred stirs up strife, but love covers all wrongs."},{"r":"10:9","th":"Walking securely","p":"Father, let me walk in integrity so our family walks securely. Remove any crooked path I have been tolerating. Let {wife} feel the security of a husband with nothing to hide.","k":"Give {kids} the security of a father who walks uprightly.","v":"He who walks blamelessly walks surely, but he who perverts his ways will be found out."},{"r":"11:25","th":"Refresh others","p":"Lord, make me a man who refreshes others. Show me how to water {wife} today with rest, help, and encouragement, and let our home overflow with generosity.","k":"Make {kids} generous hearts who refresh everyone around them.","v":"The liberal soul shall be made fat. He who waters shall be watered also himself."},{"r":"11:29","th":"Peace at home","p":"Father, keep me from troubling my own house with harshness, neglect, or distraction. Show me where my moods have weighed on {wife}, and help me make it right today.","k":"Let {kids} feel peace, not tension, when I walk through the door.","v":"He who troubles his own house shall inherit the wind. The foolish shall be servant to the wise of heart."},{"r":"12:4","th":"Her worth","p":"Lord, thank You for {wife}. She is a crown to me, and I don't say it enough. Strengthen her sense of worth today, and let me honor her in word and in action.","k":"Let {kids} see their mother honored and learn to honor her too.","v":"A worthy woman is the crown of her husband, but a disgraceful wife is as rottenness in his bones."},{"r":"12:25","th":"A kind word","p":"Father, where anxiety is weighing down {wife}'s heart, let my words bring gladness. Give me the right kind word at the right moment today.","k":"Lift any anxiety from the hearts of {kids}, and let them bring their worries to me and to You.","v":"Anxiety in a man’s heart weighs it down, but a kind word makes it glad."},{"r":"13:22","th":"Inheritance","p":"Lord, help me leave an inheritance that outlasts money: faith, character, and love. Let the way I love {wife} be part of what our family remembers.","k":"Let {kids}, and their children after them, inherit a living faith.","v":"A good man leaves an inheritance to his children’s children, but the wealth of the sinner is stored for the righteous."},{"r":"13:20","th":"Wise company","p":"Father, surround me with wise men who sharpen me, and keep me from friendships that pull me away from my family. Give {wife} godly friends who lift her up.","k":"Guide {kids} toward wise friends and away from companions who would harm them.","v":"One who walks with wise men grows wise, but a companion of fools suffers harm."},{"r":"14:26","th":"Refuge","p":"Lord, in the fear of You there is a strong fortress. Make our home that fortress. Let {wife} feel safe in it, protected and at rest.","k":"Be a refuge for {kids} all their lives, and let our home be a place they always want to come back to.","v":"In the fear of the LORD is a secure fortress, and he will be a refuge for his children."},{"r":"14:1","th":"Building the home","p":"Father, thank You for the ways {wife} builds our home, so much of it unseen. Help me notice her work and build alongside her, never tearing down with careless words.","k":"Let {kids} grow up in a house built by two people who love You.","v":"Every wise woman builds her house, but the foolish one tears it down with her own hands."},{"r":"15:1","th":"A gentle answer","p":"Lord, give me a gentle answer when I feel like giving a harsh one. If things get heated with {wife} today, help me lower my voice and raise my care.","k":"When {kids} test my patience, let my gentleness turn away anger.","v":"A gentle answer turns away wrath, but a harsh word stirs up anger."},{"r":"15:17","th":"Where love is","p":"Father, I would rather have a simple meal where love is than an impressive life without it. Fill our table with warmth tonight. Let {wife} feel loved in the ordinary moments.","k":"Let {kids} remember our table as a place of love.","v":"Better is a dinner of herbs, where love is, than a fattened calf with hatred."},{"r":"16:3","th":"Commit the work","p":"Lord, I commit my work and my plans to You today. Establish what honors You and close the doors that don't. Bless {wife}'s work too, seen and unseen.","k":"Establish the plans of {kids}, and direct their gifts toward Your purposes.","v":"Commit your deeds to the LORD, and your plans shall succeed."},{"r":"16:24","th":"Pleasant words","p":"Father, let my words be like honeycomb today, sweet to {wife}'s soul and healing to her body. Show me one specific thing to praise in her.","k":"Let {kids} hear words from me that build them up and stay with them.","v":"Pleasant words are a honeycomb, sweet to the soul, and health to the bones."},{"r":"17:6","th":"Generations","p":"Lord, thank You for the gift of family across generations. Make me a father and husband my family is glad to call their own. Bless {wife} as the heart of our home.","pn":"Lord, thank You for the gift of family across generations. Make me a husband my family is glad to call their own. Bless {wife} as the heart of our home.","k":"Let {kids} be glad to call me their father, and let me be a father who points them to You.","v":"Children’s children are the crown of old men; the glory of children are their parents."},{"r":"17:22","th":"A cheerful heart","p":"Father, give our home a cheerful heart. Bring laughter back where life has felt heavy. Let me be the one who lightens {wife}'s load and brings her joy today.","k":"Fill {kids} with joy, and let our home be full of laughter.","v":"A cheerful heart makes good medicine, but a crushed spirit dries up the bones."},{"r":"18:22","th":"A good thing","p":"Lord, in finding {wife} I found a good thing and received Your favor. Never let me take her for granted. Renew my gratitude for her today.","k":"Let {kids} grow up knowing that marriage is a good gift from You.","v":"Whoever finds a wife finds a good thing, and obtains favor of the LORD."},{"r":"18:21","th":"Speak life","p":"Father, death and life are in the power of my tongue. Let me speak life over {wife} today: over her gifts, her calling, and her beauty.","k":"Let every word I speak over {kids} be one that gives life.","v":"Death and life are in the power of the tongue; those who love it will eat its fruit."},{"r":"19:14","th":"A gift from God","p":"Lord, {wife} is from You. Thank You for her wisdom and her prudence. Help me treasure her as a gift instead of treating her as a given.","k":"Let {kids} see in their mother a picture of Your good gifts.","v":"House and riches are an inheritance from fathers, but a prudent wife is from the LORD."},{"r":"19:11","th":"Let it go","p":"Father, give me the discretion to be slow to anger and the glory of overlooking an offense. Show me what to let go of with {wife} today.","k":"Make me slow to anger with {kids}, quick to listen, and quick to forgive.","v":"The discretion of a man makes him slow to anger. It is his glory to overlook an offense."},{"r":"20:7","th":"Integrity","p":"Lord, let me walk in integrity so that my family is blessed after me. Let {wife} trust my word completely because I keep it.","k":"Let {kids} be blessed because their father walked with You.","v":"A righteous man walks in integrity. Blessed are his children after him."},{"r":"20:5","th":"Draw her out","p":"Father, the purposes in {wife}'s heart are deep waters. Give me the understanding to draw them out. Help me ask good questions today and truly listen.","k":"Help me draw out the hearts of {kids}, their fears, their hopes, and their dreams.","v":"Counsel in the heart of man is like deep water, but a man of understanding will draw it out."},{"r":"21:21","th":"Pursue kindness","p":"Lord, make me a man who pursues righteousness and kindness, not just success. Let {wife} see me chasing what matters most.","k":"Let {kids} learn from me that kindness is worth pursuing.","v":"He who follows after righteousness and kindness finds life, righteousness, and honor."},{"r":"21:23","th":"Guard the mouth","p":"Father, guard my mouth today. Keep me from the sarcastic comment, the complaint, the word I would regret. Let {wife} hear only what builds her up.","k":"Guard what I say around {kids}. Let my words be safe for them to repeat.","v":"Whoever guards his mouth and his tongue keeps his soul from troubles."},{"r":"22:6","th":"Train up","p":"Lord, give {wife} and me wisdom to train our children in the way they should go. Make us united, patient, and consistent.","pn":"Lord, train me in the way I should go. Shape my habits now, so that whatever family You build through {wife} and me grows on faithful ground.","k":"Plant Your ways so deeply in {kids} that they never depart from them.","v":"Train up a child in the way he should go, and when he is old he will not depart from it."},{"r":"22:1","th":"A good name","p":"Father, let me value a good name above wealth. Protect our family's reputation by making our character true. Let {wife} be proud to share my name.","k":"Give {kids} a good name that honors You.","v":"A good name is more desirable than great riches, and loving favor is better than silver and gold."},{"r":"23:24","th":"A father's joy","p":"Lord, give me the great joy of a father whose children walk in wisdom. Let {wife} and me rejoice together over what You are doing in our home.","pn":"Lord, fill our home with the joy that comes from walking in Your ways. Let {wife} and me rejoice together over what You are doing in us.","k":"Make {kids} righteous and wise, and let them be our delight.","v":"The father of the righteous has great joy. Whoever fathers a wise child delights in him."},{"r":"23:26","th":"Give Him your heart","p":"Father, I give You my heart today, not just my schedule. Let my eyes delight in Your ways. Draw {wife}'s heart close to Yours as well.","k":"Win the hearts of {kids}, early and completely.","v":"My son, give me your heart; and let your eyes keep in my ways."},{"r":"24:3-4","th":"Built by wisdom","p":"Lord, build our house with wisdom and establish it with understanding. Fill its rooms with treasures that last: peace, laughter, faith, and my love for {wife}.","k":"Fill our home with treasures {kids} will carry with them.","v":"Through wisdom a house is built; by understanding it is established; by knowledge the rooms are filled with all rare and beautiful treasure."},{"r":"24:16","th":"Rise again","p":"Father, when I fall short as a husband, help me rise again instead of hiding or quitting. Let {wife} see a man who owns his mistakes and keeps getting back up.","k":"Teach {kids} that falling is not the end, and that You help us rise.","v":"for a righteous man falls seven times and rises up again; but the wicked are overthrown by calamity."},{"r":"25:11","th":"The right word","p":"Lord, give me a well-timed word for {wife} today, something true and beautiful that she needs to hear.","k":"Give me the right word at the right time for {kids}.","v":"A word fitly spoken is like apples of gold in settings of silver."},{"r":"25:28","th":"Self-control","p":"Father, without self-control I am a city without walls. Strengthen my discipline with my temper, my screen time, and my appetites, so {wife} is protected by my restraint.","k":"Let {kids} see self-control lived out in me.","v":"Like a city that is broken down and without walls is a man whose spirit is without restraint."},{"r":"26:20","th":"Starve the quarrel","p":"Lord, let me be the one who stops adding wood to the fire. When conflict rises with {wife}, help me refuse to fuel it and choose peace.","k":"Keep quarrels between {kids} short, and let peace return quickly.","v":"For lack of wood a fire goes out. Without gossip, a quarrel dies down."},{"r":"26:14","th":"Show up","p":"Father, keep me from the sluggard's comfort. Give me energy to show up fully for {wife} after a long day, engaged and not just present.","k":"Let {kids} get the best of me, not what's left over.","v":"As the door turns on its hinges, so does the sluggard on his bed."},{"r":"27:17","th":"Sharpened","p":"Lord, sharpen me through godly men and through {wife}'s honest words. Make me open to correction and quick to grow.","k":"Place people around {kids} who will sharpen them in faith.","v":"Iron sharpens iron; so a man sharpens his friend’s countenance."},{"r":"27:23-24","th":"Know your flock","p":"Father, help me know the true state of my family: how {wife} is really doing, not just how she seems. Show me what she needs from me this week.","k":"Help me pay close attention to the hearts of {kids}.","v":"Know well the state of your flocks, and pay attention to your herds: for riches are not forever, nor does the crown endure to all generations."},{"r":"28:13","th":"Confession","p":"Lord, I confess the sins I have been hiding, and I turn from them. Thank You for mercy. Give me courage to confess to {wife} where I need to, and grace to receive hers.","k":"Let {kids} learn from me that confession is safe in our home.","v":"He who conceals his sins doesn’t prosper, but whoever confesses and renounces them finds mercy."},{"r":"28:20","th":"Faithful","p":"Father, make me a faithful man, rich in blessing instead of hasty for gain. Let {wife} see that my first loyalty is to You, then to her, then to everything else.","k":"Let {kids} inherit a faithful father's blessing.","v":"A faithful man is rich with blessings; but one who is eager to be rich will not go unpunished."},{"r":"29:17","th":"Loving correction","p":"Lord, give {wife} and me wisdom to correct with love, consistency, and patience. Let discipline in our home lead to peace, not fear.","pn":"Lord, make me correctable, and gentle when I must correct. Let the way {wife} and I handle hard conversations lead to peace, not fear.","k":"Shape {kids} through loving correction, and let them bring delight to our souls.","v":"Correct your son, and he will give you peace; yes, he will bring delight to your soul."},{"r":"29:25","th":"Free from fear","p":"Father, free me from the fear of man. Let me lead my home by Your Word, not by what others think. Give {wife} confidence in Your safety today.","k":"Let {kids} be bold for You and free from the fear of what others think.","v":"The fear of man proves to be a snare, but whoever puts his trust in the LORD is kept safe."},{"r":"30:5","th":"Refuge in His Word","p":"Lord, every word of Yours is flawless. Be a shield around {wife} today, and let her take refuge in You.","k":"Shield {kids} with Your truth wherever they go today.","v":"Every word of God is flawless. He is a shield to those who take refuge in him."},{"r":"30:8-9","th":"Enough","p":"Father, give us neither poverty nor riches, only what we need. Keep me content and honest. Free {wife} from financial worry, and help us steward what You give.","k":"Teach {kids} contentment and generosity.","v":"Remove far from me falsehood and lies. Give me neither poverty nor riches. Feed me with the food that is needful for me, lest I be full, deny you, and say, ‘Who is the LORD?’ or lest I be poor, and steal, and so dishonor the name of my God."},{"r":"31:10-11","th":"Far above rubies","p":"Lord, {wife} is worth far more than rubies, and my heart trusts in her. Let her know today that she is treasured, trusted, and deeply loved.","k":"Let {kids} grow up knowing the worth of their mother.","v":"Who can find a worthy woman? For her price is far above rubies. The heart of her husband trusts in her. He shall have no lack of gain."},{"r":"31:28-29","th":"Rise up and bless","p":"Father, make me the husband who praises {wife} out loud. Give me words to bless her tonight, and let her hear them from me first.","k":"Let {kids} rise up and call their mother blessed.","v":"Her children rise up and call her blessed. Her husband also praises her: ‘Many women do noble things, but you excel them all.’"}]};
const WEEK = DATA.week, PRAYERS = DATA.prayers;
const KEY = "gardener:v1";
const INTERVAL_H = 2;

/* ---------------- time helpers */
const now = () => (window.__GARDENER_NOW ? new Date(window.__GARDENER_NOW) : new Date());
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtHour = h => { const hh = h % 12 || 12; return `${hh} ${h < 12 || h === 24 ? "AM" : "PM"}`; };
const fmtClock = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const fmtMD = d => d.toLocaleDateString(undefined, { month: "long", day: "numeric" });
const weekIndex = d => Math.floor((sod(d).getTime() - new Date(2024, 0, 7).getTime()) / (7 * 864e5));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r = document) => r.querySelector(s);

/* ---------------- storage */
const fresh = () => ({ v: 1, profile: { name: "", wife: "", kids: [], start: 8, end: 20, notify: true, onboarded: false, since: null }, days: {}, notes: [] });
let memory = null;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return memory;
}
let S = load() || fresh();
S = Object.assign(fresh(), S); S.profile = Object.assign(fresh().profile, S.profile || {}); S.days = S.days || {}; S.notes = S.notes || [];
function save() {
  memory = S;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  afterChange();
}

/* ---------------- people + content */
const P = () => S.profile;
const hasKids = () => P().kids.length > 0;
const wifeName = () => P().wife.trim() || "my wife";
const joinNames = a => a.length <= 1 ? (a[0] || "") : a.length === 2 ? `${a[0]} and ${a[1]}` : `${a.slice(0, -1).join(", ")}, and ${a[a.length - 1]}`;
const kidsName = () => hasKids() ? joinNames(P().kids) : "my children";
const fill = t => t.replaceAll("{wife}", wifeName()).replaceAll("{kids}", kidsName());
const tasksFor = d => WEEK[d.getDay()].tasks.map(t => (!hasKids() && t.alt) ? t.alt : t);
const featured = (t, i, d) => t.ideas[(weekIndex(d) + i) % t.ideas.length];
const prayerFor = d => PRAYERS[(d.getDate() - 1) * 2 + (d.getMonth() % 2)];
const chapterOf = r => r.split(":")[0];
const dash = r => r.replace("-", "–");
function rec(k) { return S.days[k] || { d: [] }; }
function recW(k) { if (!S.days[k]) S.days[k] = { d: [] }; return S.days[k]; }
const isComplete = k => rec(k).d.length >= 3;

function streak() {
  let d = sod(now()); if (!isComplete(ymd(d))) d = addDays(d, -1);
  let n = 0; while (isComplete(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}
function longest() {
  const keys = Object.keys(S.days).filter(isComplete).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) { const d = fromKey(k); run = prev && ymd(addDays(prev, 1)) === k ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}

/* ---------------- REMINDERS */
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const CAP = window.Capacitor;
const IS_NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
let LN = null;
if (IS_NATIVE) { try { LN = (CAP.registerPlugin && CAP.registerPlugin("LocalNotifications")) || (CAP.Plugins && CAP.Plugins.LocalNotifications); } catch (e) { LN = CAP.Plugins && CAP.Plugins.LocalNotifications; } }
let nativePerm = "prompt";

function slotsFor(day) {
  const out = [];

  return out;
}
function nextSlot() {

  const n = now(), base = sod(n);
  for (let i = 0; i < 8; i++) {
    const day = addDays(base, i);

    for (const s of slotsFor(day)) if (s > n && s.getTime() !== lastFired) return s;
  }
  return null;
}
const NUDGE_TITLES = { many: ["{n} left to tend today", "Your garden needs tending", "{n} left today. There's still time.", "A moment to tend what matters"], one: ["One left to tend today", "Your garden needs tending", "One left. There's still time.", "A moment to tend what matters"] };
function nudgeFor(day, doneIdx, slotIndex) {
  const tasks = tasksFor(day), left = tasks.map((t, i) => ({ t, i })).filter(x => !doneIdx.includes(x.i));
  if (!left.length) return null;
  const pick = left[slotIndex % left.length];
  const set = left.length === 1 ? NUDGE_TITLES.one : NUDGE_TITLES.many;
  const title = set[slotIndex % set.length].replace("{n}", left.length);
  return { title, body: `${pick.t.t} Try: ${featured(pick.t, pick.i, day)}` };
}
function notifState() {
  if (!P().notify) return { ok: false, canAsk: false, text: "Reminders are off. Turn them on to get a nudge every two hours." };
  if (IS_NATIVE) {
    if (nativePerm === "granted") return { ok: true, canAsk: false, text: `On. You'll get a notification every two hours from ${fmtHour(P().start)} to ${fmtHour(P().end)} until today is tended, even when the app is closed.` };
    if (nativePerm === "denied") return { ok: false, canAsk: false, text: "Notifications are blocked. Turn them on for The Gardener in your phone's Settings." };
    return { ok: false, canAsk: true, text: "Allow notifications so your phone can nudge you." };
  }
  if (IN_FRAME) return { ok: false, canAsk: false, text: "This preview shows nudges inside the app while it's open. Phone notifications start once The Gardener is installed on your phone." };
  if (!("Notification" in window)) return { ok: false, canAsk: false, text: IS_STANDALONE ? "This phone doesn't allow notifications for web apps. Nudges show inside the app while it's open." : "Add The Gardener to your home screen to allow notifications. Until then, nudges show inside the app." };
  if (Notification.permission === "granted") return { ok: true, canAsk: false, text: `On. Nudges arrive every two hours from ${fmtHour(P().start)} to ${fmtHour(P().end)} while The Gardener is open or running in the background. Keep it on your home screen for the best results.` };
  if (Notification.permission === "denied") return { ok: false, canAsk: false, text: "Notifications are blocked for The Gardener. Allow them in your browser or phone settings." };

}
async function requestNotif() {

    if (IS_NATIVE && LN) { const r = await LN.requestPermissions(); nativePerm = r.display; return r.display === "granted"; }
    if (IN_FRAME || !("Notification" in window)) return false;
    const r = await Notification.requestPermission(); return r === "granted";
  } catch (e) { return false; }
}
async function showSystem(title, body) {
  if (IS_NATIVE && LN && nativePerm === "granted") {
    await LN.schedule({ notifications: [{ id: 9999, title, body, schedule: { at: new Date(Date.now() + 1500), allowWhileIdle: true }, isExactNotification: false }] });
    return true;
  }
  if (IN_FRAME || !("Notification" in window) || Notification.permission !== "granted") return false;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) { await reg.showNotification(title, { body, icon: "icon-192.png", badge: "badge-96.png", tag: "gardener-nudge", renotify: true, data: { url: "./" } }); return true; }

  } catch (e) { return false; }
}
let nudgeTimer = null, lastFired = 0;
function scheduleWeb() {
  clearTimeout(nudgeTimer);
  const next = nextSlot(); if (!next || IS_NATIVE) return;
  const ms = Math.max(1000, next.getTime() - now().getTime());
  nudgeTimer = setTimeout(() => { fireNudge(next); scheduleWeb(); }, Math.min(ms, 2147483000));
}
async function fireNudge(slot) {
  if (slot.getTime() === lastFired) return;
  lastFired = slot.getTime();
  const d = now(), k = ymd(d); if (isComplete(k) || !P().notify) return;
  const idx = slotsFor(sod(d)).findIndex(s => s.getHours() === slot.getHours());
  const m = nudgeFor(d, rec(k).d, Math.max(0, idx)); if (!m) return;
  const shown = document.visibilityState === "hidden" ? await showSystem(m.title, m.body) : false;

}
async function scheduleNative() {

    const perm = await LN.checkPermissions(); nativePerm = perm.display;
    const pending = await LN.getPending();
    const ours = (pending.notifications || []).filter(n => n.id >= 1000 && n.id < 9000).map(n => ({ id: n.id }));
    if (ours.length) await LN.cancel({ notifications: ours });
    if (!P().notify || nativePerm !== "granted") return;
    const list = [], n = now(), base = sod(n);
    for (let dOff = 0; dOff < 7; dOff++) {
      const day = addDays(base, dOff), k = ymd(day), done = rec(k).d;
      if (done.length >= 3) continue;
      slotsFor(day).forEach((at, si) => {
        if (at <= n) return;
        const m = nudgeFor(day, done, si); if (!m) return;
        list.push({ id: 1000 + dOff * 100 + si, title: m.title, body: m.body, schedule: { at, allowWhileIdle: true }, isExactNotification: false });
      });
    }
    if (list.length) await LN.schedule({ notifications: list.slice(0, 60) });
  } catch (e) { console.warn("Reminder scheduling failed", e); }
}
function mirrorForWorker() {

  const d = now();
  const summary = { date: ymd(d), done: rec(ymd(d)).d, notify: P().notify, start: P().start, end: P().end, interval: INTERVAL_H,
    week: [0, 1, 2, 3, 4, 5, 6].map(dow => { const day = addDays(sod(d), (dow - d.getDay() + 7) % 7); return tasksFor(day).map((t, i) => ({ t: t.t, idea: featured(t, i, day) })); }) };
  caches.open("gardener-state").then(c => c.put("./__state", new Response(JSON.stringify(summary), { headers: { "content-type": "application/json" } }))).catch(() => {});
}
async function registerPeriodic() {

const rescheduleNative = debounce(scheduleNative, 600);

/* ---------------- render + routing */
function renderChrome() {

}

/* ---------------- events */
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  switch (act) {
    case "tab": closeSheet(); go(a.dataset.view); break;
    case "toggle-task": toggleTask(+a.dataset.i); break;
    case "toggle-ideas": { const k = a.dataset.key; openIdeas.has(k) ? openIdeas.delete(k) : openIdeas.add(k); view === "week" ? renderWeek() : renderToday(); break; }
    case "note-task": { const d = fromKey(a.dataset.k); const t = tasksFor(d)[+a.dataset.i]; openNote({ task: t.t, date: a.dataset.k }); break; }
    case "open-prayer": showPrayer(); break;
    case "close-prayer": closePrayer(); render(); break;
    case "amen": { const w = recW(ymd(now())); const first = !w.a; w.a = 1; w.p = 1; save(); closePrayer(); if (first) toast("Amen. Go tend your garden."); break; }
    case "pick-day": weekPick = a.dataset.k; renderWeek(); break;
    case "new-note": openNote({}); break;
    case "edit-note": openNote({ id: a.dataset.id }); break;
    case "note-tag": noteDraft.text = $("#noteText").value; noteDraft.tag = noteDraft.tag === a.dataset.tag ? "" : a.dataset.tag; document.querySelectorAll('[data-act="note-tag"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.tag === noteDraft.tag)); break;
    case "save-note": saveNote(); break;
    case "delete-note": noteDraft.text = $("#noteText").value; renderNoteSheet(true); break;
    case "delete-note-no": renderNoteSheet(false); break;
    case "delete-note-yes": S.notes = S.notes.filter(n => n.id !== noteDraft.id); closeSheet(); save(); toast("Note deleted."); break;
    case "filter": jFilter = a.dataset.tag; renderJournal(); break;
    case "open-settings": renderSettings(); break;
    case "close-sheet": closeSheet(); break;
    case "toggle-notify": { const on = !P().notify; P().notify = on; if (on) await requestNotif(); save(); await refreshPerm(); renderSettings(); break; }
    case "enable-notif": { const ok = await requestNotif(); if (!ok) toast("Notifications weren't allowed."); save(); await refreshPerm(); renderSettings(); break; }
    case "test-notif": {
      const d = now(), m = nudgeFor(d, rec(ymd(d)).d, d.getHours()) || { title: "Today is tended", body: "Nothing left today. Rest well, and see you tomorrow." };
      const sent = await showSystem(m.title, m.body);

    }
    case "copy-journal": copyJournal(); break;

    case "reset-no": renderSettings(false); break;
    case "reset-yes": S = fresh(); memory = null; try { localStorage.removeItem(KEY); } catch (err) {} closeSheet(); lastStage = null; view = "today"; obStep = 0; save(); renderOnboard(); break;
    case "banner": hideBanner(); closePrayer(); closeSheet(); go("today"); break;
    case "ob-next": obStep = Math.min(2, obStep + 1); renderOnboard(); break;
    case "ob-back": obStep = Math.max(0, obStep - 1); renderOnboard(); break;
    case "ob-finish": finishOnboard(a.dataset.notify === "1"); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "jsearch") { jQuery = e.target.value; renderJournal(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#sheet").hidden) closeSheet(); else if (!$("#prayer").hidden) { closePrayer(); render(); }
});
function copyJournal() {
  const text = [...S.notes].sort((a, b) => a.ts - b.ts).map(n => `${fmtLong(new Date(n.ts))}${n.tag ? " · " + tagLabel(n.tag) : ""}${n.task ? "\nOn: " + n.task : ""}\n${n.text}`).join("\n\n");
  if (!text) { toast("No notes yet."); return; }
  const fallback = () => openSheet(`<div class="sheet-head"><h2>Your journal</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">${I.x}</button></div><p class="muted">Select all and copy.</p><textarea class="textarea" id="exportText" readonly style="min-height:320px">${esc(text)}</textarea>`, "export");
  try { navigator.clipboard.writeText(text).then(() => toast("Journal copied."), () => { fallback(); setTimeout(() => $("#exportText")?.select(), 400); }); }
  catch (e) { fallback(); }
}
async function refreshPerm() { if (IS_NATIVE && LN) { try { nativePerm = (await LN.checkPermissions()).display; } catch (e) {} } }

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkRollover(); maybePrayer(); scheduleWeb(); if (view === "today") renderToday(); } });
setInterval(checkRollover, 60 * 1000);
setInterval(() => { if (view === "today" && document.visibilityState === "visible" && $("#sheet").hidden) { const h = $(".hero-status"); if (h) h.innerHTML = statusLine(ymd(now())); } }, 60 * 1000);

/* ---------------- boot */
(async function boot() {
  if (IS_NATIVE) { await refreshPerm(); try { const AppP = (CAP.registerPlugin && CAP.registerPlugin("App")) || CAP.Plugins?.App; AppP?.addListener?.("appStateChange", st => { if (st.isActive) { checkRollover(); maybePrayer(); scheduleNative(); } }); } catch (e) {} }
  render();
  if (!P().onboarded) renderOnboard(); else maybePrayer();
  scheduleWeb(); scheduleNative(); mirrorForWorker(); registerPeriodic();
})();
window.__gardener = { get state() { return S; }, render, fireNudge: () => { const s = nextSlot() || now(); fireNudge(s); } };
})();
</script>

<script>
window.__GARDENER_PWA = true;
if ("serviceWorker" in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
