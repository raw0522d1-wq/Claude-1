name: Launchpad

# Drop an app's files into apps/<name>/ on the launchpad branch and this builds
# the Android and iPhone apps, then uploads them to Google Play and App Store
# Connect (TestFlight) when the store keys are saved as repository secrets.
# See README.md for the one-time setup.

on:
  push:
    branches: [launchpad-signing-test]
    paths: ["apps/**"]
  workflow_dispatch:
    inputs:
      app:
        description: "App folder inside apps/ (for example: the-gardener)"
        required: true
      stores:
        description: "Which stores"
        type: choice
        options: [both, google-play, app-store]
        default: both

permissions:
  contents: read

concurrency:
  group: launchpad
  cancel-in-progress: false

jobs:
  plan:
    name: Find apps to ship
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
      android: ${{ steps.find.outputs.android }}
      ios: ${{ steps.find.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: find
        env:
          INPUT_APP: ${{ github.event.inputs.app }}
          INPUT_STORES: ${{ github.event.inputs.stores }}
          BEFORE: ${{ github.event.before }}
        run: node launchpad/plan.mjs

  android:
    name: Google Play · ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.apps != '[]' && needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      HAS_KEYSTORE: 'true'
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare the Android project
        id: prep
        run: |
          node launchpad/prepare.mjs --app "apps/$APP" --platform android --out "build/$APP" --build "$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))"
          echo "info=$(tr -d '\n' < "build/$APP/launchpad.json")" >> "$GITHUB_OUTPUT"

      - name: Load the upload key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass testpass123 -keypass testpass123 -dname "CN=Signing Test"
          base64 -w0 "$RUNNER_TEMP/throwaway.jks" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "LAUNCHPAD_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build
        id: build
        working-directory: build/${{ matrix.app }}/android
        env:
          LAUNCHPAD_KEYSTORE_PASSWORD: testpass123
          LAUNCHPAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAUNCHPAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease
          else ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug; fi

      - name: Collect the files
        id: files
        run: |
          VERSION="${{ fromJson(steps.prep.outputs.info).version }}"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          B="build/$APP/android/app/build/outputs"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp "$B/bundle/release/app-release.aab" "$OUT/$APP-$VERSION.aab"
            cp "$B/apk/release/app-release.apk" "$OUT/$APP-$VERSION.apk"
          else
            cp "$B/apk/debug/app-debug.apk" "$OUT/$APP-$VERSION-test.apk"
          fi
          ls -la "$OUT"
          echo "== signature check"; "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$OUT"/*.apk | head -3
          keytool -printcert -jarfile "$OUT"/*.aab | head -3
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: ${{ steps.files.outputs.dir }}
          retention-days: 30

      - name: Upload to Google Play
        id: play
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ fromJson(steps.prep.outputs.info).id }}
          releaseFiles: ${{ steps.files.outputs.dir }}/*.aab
          track: ${{ fromJson(steps.prep.outputs.info).googlePlayTrack }}
          status: completed

      # Apps that haven't passed their first review only accept draft releases.
      - name: Upload to Google Play as a draft
        id: play_draft
        if: steps.play.outcome == 'failure'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ fromJson(steps.prep.outputs.info).id }}
          releaseFiles: ${{ steps.files.outputs.dir }}/*.aab
          track: ${{ fromJson(steps.prep.outputs.info).googlePlayTrack }}
          status: draft

      - name: Report
        if: always()
        env:
          PLATFORM: android
          APP_INFO: ${{ steps.prep.outputs.info }}
          BUILD: ${{ steps.files.outcome }}
          PLAY: ${{ steps.play.outcome }}
          PLAY_DRAFT: ${{ steps.play_draft.outcome }}
        run: node launchpad/report.mjs

      - name: Stop if Google Play refused the upload
        if: steps.play.outcome == 'failure' && steps.play_draft.outcome == 'failure'
        run: exit 1

  ios:
    name: App Store · ${{ matrix.app }}
    needs: plan
    if: false
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      HAS_ASC: ${{ secrets.APPLE_TEAM_ID != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Xcode version
        run: xcodebuild -version

      - name: Prepare the iPhone project
        id: prep
        run: |
          node launchpad/prepare.mjs --app "apps/$APP" --platform ios --out "build/$APP" --build "$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))"
          echo "info=$(tr -d '\n' < "build/$APP/launchpad.json")" >> "$GITHUB_OUTPUT"

      # Built unsigned; Apple's cloud signing signs it during upload, so no certificates are stored here.
      - name: Build
        id: build
        working-directory: build/${{ matrix.app }}/ios/App
        run: |
          xcodebuild -list -project App.xcodeproj
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation -quiet \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          echo "Archive ready"

      - name: Check App Store Connect
        id: asc
        if: env.HAS_ASC == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          node launchpad/asc.mjs write-key "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          ASC_KEY_PATH="$KEY" node launchpad/asc.mjs check --bundle-id "${{ fromJson(steps.prep.outputs.info).id }}" --name "${{ fromJson(steps.prep.outputs.info).name }}"

      - name: Sign and upload to TestFlight
        id: upload
        if: steps.asc.outputs.status == 'ready'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$(echo "$TEAM_ID" | tr -d '[:space:]')</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$(echo "$ASC_KEY_ID" | tr -d '[:space:]')" \
            -authenticationKeyIssuerID "$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')"

      - name: Report
        if: always()
        env:
          PLATFORM: ios
          APP_INFO: ${{ steps.prep.outputs.info }}
          BUILD: ${{ steps.build.outcome }}
          ASC_CHECK: ${{ steps.asc.outcome }}
          ASC_STATUS: ${{ steps.asc.outputs.status }}
          ASC_ERROR: ${{ steps.asc.outputs.error }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: node launchpad/report.mjs

      - name: Stop if App Store Connect refused
        if: steps.asc.outcome == 'failure'
        run: exit 1
